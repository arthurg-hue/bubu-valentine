<div
  class="flex flex-col items-center justify-center min-h-screen bg-[#FFD1DC] p-6 text-center overflow-hidden touch-none font-sans"
>
  <div class="mb-8 h-64 flex items-center justify-center">
    <img
      [src]="currentGif"
      class="max-h-full rounded-2xl shadow-xl border-4 border-white transition-all duration-300"
    />
  </div>

  <div *ngIf="!accepted">
    <h1 class="text-3xl md:text-5xl font-extrabold text-[#C71585] mb-10 select-none">
      Bubu, จะเป็นวาเลนไทน์ของผมตลอดไปไหม? ❤️
    </h1>

    <div class="flex flex-wrap items-center justify-center gap-6">
      <button
        (click)="onYesClick()"
        [style.fontSize.px]="yesButtonSize"
        class="bg-green-500 hover:bg-green-600 text-white font-bold py-3 px-10 rounded-full shadow-lg z-10 transition-all active:scale-95"
      >
        ใช่!
      </button>

      <button
        (pointerdown)="moveButton($event)"
        (click)="$event.preventDefault()"
        [ngStyle]="noButtonStyle"
        class="bg-gray-100 text-gray-600 font-bold py-3 px-8 rounded-full shadow-md select-none touch-none"
      >
        {{ noButtonText }}
      </button>
    </div>
  </div>

  <div *ngIf="accepted" class="animate-bounce mt-4">
    <h2 class="text-4xl md:text-6xl font-serif text-[#C71585] font-bold">
      เย้! ❤️ เจอกันวันที่ 2 พฤษภาคมนะ!
    </h2>
  </div>
</div>
